<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple yet powerful to-do list application with local storage">
    <title>✅ TODO List App</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="header-content">
                <h1><i class="fas fa-check-circle"></i> My Tasks</h1>
                <p class="subtitle">Stay organized and productive</p>
            </div>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </header>
        <main class="app-main">
            <section class="input-section">
                <div class="input-wrapper">
                    <input type="text" id="todoInput" class="todo-input" placeholder="Add a new task..." autocomplete="off">
                    <button id="addBtn" class="add-btn"><i class="fas fa-plus"></i> Add</button>
                </div>
            </section>
            <section class="filter-section">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">
                        <span class="filter-label">All</span>
                        <span class="filter-count" id="allCount">0</span>
                    </button>
                    <button class="filter-btn" data-filter="active">
                        <span class="filter-label">Active</span>
                        <span class="filter-count" id="activeCount">0</span>
                    </button>
                    <button class="filter-btn" data-filter="completed">
                        <span class="filter-label">Completed</span>
                        <span class="filter-count" id="completedCount">0</span>
                    </button>
                </div>
                <button id="clearBtn" class="clear-btn"><i class="fas fa-trash"></i> Clear Completed</button>
            </section>
            <section class="tasks-section">
                <ul id="todoList" class="todo-list"></ul>
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-inbox"></i>
                    <p>No tasks yet. Add one to get started!</p>
                </div>
            </section>
            <section class="stats-section">
                <div class="stat">
                    <span class="stat-label">Total:</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Progress:</span>
                    <span class="stat-value" id="progress">0%</span>
                </div>
            </section>
        </main>
        <footer class="app-footer">
            <p>Made with <i class="fas fa-heart"></i> for productivity</p>
        </footer>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
